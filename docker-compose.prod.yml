# Standalone production stack -- deliberately NOT a docker-compose.yml
# override. Compose concatenates (not replaces) list-valued keys like
# `ports`/`volumes` across override files, so overriding those here would
# risk silently keeping the dev file's live source-mount and its exposed
# port 8000 (bypassing nginx) rather than clearing them. A separate,
# self-contained file is more duplication but there's no ambiguity about
# what actually runs.
#
# Usage: see docs/DEPLOY_NAMECHEAP_VPS.md
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: msafiri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: msafiri_space
      POSTGRES_USER: msafiri_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - msafiri_network
    # No host port mapping -- only reachable from other containers on
    # msafiri_network, never directly from the internet.

  redis:
    image: redis:7-alpine
    container_name: msafiri_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - msafiri_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msafiri_backend
    restart: unless-stopped
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=msafiri.settings
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://msafiri_user:${POSTGRES_PASSWORD}@postgres:5432/msafiri_space
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=msafirispace.com,www.msafirispace.com
      - CORS_ALLOWED_ORIGINS=https://msafirispace.com,https://www.msafirispace.com
      - SITE_URL=https://msafirispace.com
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE}
      - MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - USE_CLOUDINARY_STORAGE=${USE_CLOUDINARY_STORAGE:-False}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # No ./backend:/app live-source mount -- production runs the image
      # exactly as built, not whatever happens to be on disk on the VPS.
    networks:
      - msafiri_network
    # No host port mapping -- only nginx talks to this, over msafiri_network.

  frontend_prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api/v1
    container_name: msafiri_frontend_prod
    restart: unless-stopped
    networks:
      - msafiri_network

  nginx:
    image: nginx:alpine
    container_name: msafiri_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - frontend_prod
    networks:
      - msafiri_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  msafiri_network:
    driver: bridge
