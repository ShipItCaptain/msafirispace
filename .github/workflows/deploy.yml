name: Deploy

# Auto-deploys on every push to main. Proven stable via one real
# failure-and-recovery cycle (2026-10-26: a corrupted SSH key secret broke
# the first automated run, fixed and re-verified end-to-end -- see
# "fix(deploy): base64-encode SSH_PRIVATE_KEY secret"). workflow_dispatch
# kept as a manual escape hatch for re-running without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_URL: https://api.msafirispace.com/api/v1
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # SSH_PRIVATE_KEY is base64 of the whole key (one line) rather than the
      # raw multi-line PEM -- pasting a multi-line private key into GitHub's
      # secret field is prone to silently losing its exact line breaks
      # (e.g. terminal soft-wrap getting flattened on copy), which corrupts
      # it in a way that only shows up as a cryptic "error in libcrypto" at
      # deploy time. Base64 is a single line and immune to that.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend code
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude='media/' \
            --exclude='staticfiles/' \
            --exclude='tmp/' \
            --exclude='logs/' \
            --exclude='public/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='passenger_wsgi.py' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            backend/ "$SSH_USER@$SSH_HOST:msafiri_backend/"

      - name: Write passenger_wsgi.py
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          cat > /tmp/passenger_wsgi.py <<'EOF'
          import sys
          import os

          sys.path.insert(0, os.path.dirname(__file__))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'msafiri.settings')

          from msafiri.wsgi import application
          EOF
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            /tmp/passenger_wsgi.py "$SSH_USER@$SSH_HOST:msafiri_backend/passenger_wsgi.py"
          rm -f /tmp/passenger_wsgi.py

      # Ensure the static/media bypass rule exists in .htaccess. Idempotent
      # and kept separate from the env-vars step below: cloudlinux-selector
      # (next step) only ever touches its own two marker-delimited blocks
      # (Passenger config + env vars) and leaves everything else in the file
      # alone -- confirmed by direct testing -- so this rule survives every
      # future env-var update without being re-written each time.
      - name: Ensure static/media bypass rule in api.msafirispace.com/.htaccess
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" '
            touch ~/api.msafirispace.com/.htaccess
            if ! grep -q "Static/media bypass" ~/api.msafirispace.com/.htaccess; then
              cat >> ~/api.msafirispace.com/.htaccess <<'"'"'EOF'"'"'

          # Static/media bypass -- served directly, not routed through Passenger/Django
          RewriteEngine On
          RewriteCond %{REQUEST_URI} ^/static/ [OR]
          RewriteCond %{REQUEST_URI} ^/media/
          RewriteRule ^ - [L]
          EOF
            fi
          '

      # The host is CloudLinux/LiteSpeed Passenger -- CRITICAL: the actual
      # source of truth the running app reads is
      # ~/.cl.selector/python-selector.json, NOT .htaccess directly.
      # .htaccess's SetEnv block is only ever a generated reflection of that
      # JSON. A past version of this workflow wrote .htaccess directly via
      # scp, which looked correct (and even passed manual verification) but
      # never touched the real JSON store -- so the live app kept reading
      # stale values (an old Gmail account for EMAIL_HOST_USER) despite
      # .htaccess showing the new ones. Must go through cloudlinux-selector
      # so both the JSON store and the generated .htaccess stay consistent.
      - name: Set environment variables (cloudlinux-selector)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FILE_ENCRYPTION_KEY: ${{ secrets.FILE_ENCRYPTION_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        run: |
          # Build the finished JSON *here on the runner*, where the secrets
          # above actually exist as env vars -- a previous version of this
          # step shipped Python code that called os.environ[...] on the
          # *remote* side via a separate `ssh ... python3 script.py`, but
          # that's a new process on the server with no idea these secrets
          # exist, so it failed with KeyError. Ship the already-filled-in
          # data (plain JSON), not code that expects secrets to be lying
          # around remotely.
          python3 -c "
          import json, os, urllib.parse
          db_password_encoded = urllib.parse.quote(os.environ['DB_PASSWORD'], safe='')
          env_vars = {
              'CACHE_BACKEND': 'database',
              'SECRET_KEY': os.environ['SECRET_KEY'],
              'FILE_ENCRYPTION_KEY': os.environ['FILE_ENCRYPTION_KEY'],
              'SITE_URL': 'https://msafirispace.com',
              'ALLOWED_HOSTS': 'api.msafirispace.com',
              'CORS_ALLOWED_ORIGINS': 'https://msafirispace.com,https://www.msafirispace.com',
              'DEBUG': 'False',
              'EMAIL_BACKEND': 'django.core.mail.backends.smtp.EmailBackend',
              'EMAIL_HOST': '127.0.0.1',
              'EMAIL_HOST_PASSWORD': os.environ['EMAIL_HOST_PASSWORD'],
              'EMAIL_HOST_USER': os.environ['EMAIL_HOST_USER'],
              # otp.py sends with from_email=settings.DEFAULT_FROM_EMAIL,
              # which defaults to a bogus dev@msafirispace.local when unset
              # -- Exim correctly rejects that as spoofing (that domain
              # isn't hosted here). Real bug, found via a live user's
              # registration actually failing silently (the registration
              # view swallows OTP-send exceptions so account creation isn't
              # blocked by a mail hiccup -- but that also means a broken
              # From address produces no visible error to anyone except
              # this log file).
              'DEFAULT_FROM_EMAIL': os.environ['EMAIL_HOST_USER'],
              'USE_CLOUDINARY_STORAGE': 'False',
              'DATABASE_URL': 'postgresql://msafbuat_msafiri_user:' + db_password_encoded + '@localhost:5432/msafbuat_msafiri_space',
          }
          with open('/tmp/env_vars.json', 'w') as f:
              json.dump(env_vars, f)
          "
          # This script only ever reads the JSON file above -- no secrets of
          # its own, so no quoting hazard shipping it to the remote shell.
          cat > /tmp/apply_env_vars.py <<'PYEOF'
          import json
          import subprocess

          with open('/tmp/env_vars.json') as f:
              env_vars = json.load(f)

          result = subprocess.run(
              [
                  'cloudlinux-selector', 'set', '--json',
                  '--interpreter', 'python',
                  '--user', 'msafbuat',
                  '--app-root', 'msafiri_backend',
                  '--env-vars', json.dumps(env_vars),
              ],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          print('stdout:', result.stdout.decode())
          print('stderr:', result.stderr.decode())
          if result.returncode != 0 or b'"result": "success"' not in result.stdout:
              raise SystemExit('cloudlinux-selector set --env-vars failed')
          PYEOF
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            /tmp/env_vars.json /tmp/apply_env_vars.py "$SSH_USER@$SSH_HOST:/tmp/"
          rm -f /tmp/env_vars.json /tmp/apply_env_vars.py
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "python3 /tmp/apply_env_vars.py && rm -f /tmp/apply_env_vars.py /tmp/env_vars.json"

      # Passenger only ever sees requests for the Django app itself -- static
      # and media files need to resolve as real files in the subdomain's own
      # document root (where the .htaccess bypass above takes effect), which
      # is a different directory from PassengerAppRoot.
      - name: Symlink static/media into the subdomain document root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" '
            ln -sfn ~/msafiri_backend/staticfiles ~/api.msafirispace.com/static
            ln -sfn ~/msafiri_backend/media ~/api.msafirispace.com/media
          '

      - name: Install deps, migrate, collectstatic, restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" '
            set -e
            source ~/virtualenv/msafiri_backend/3.11/bin/activate
            cd ~/msafiri_backend
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py createcachetable
            python manage.py collectstatic --noinput
            mkdir -p tmp
            touch tmp/restart.txt
          '

      - name: Deploy frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            frontend/build/ "$SSH_USER@$SSH_HOST:public_html/"

      # Regenerated each deploy (not just preserved via the rsync --exclude
      # above) so a from-scratch server setup gets this right automatically
      # instead of relying on someone re-copying it from the deploy doc.
      - name: Write public_html/.htaccess
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          cat > /tmp/public_html.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>

          # index.html has no content-hash in its filename and references the
          # hashed JS/CSS bundle by name -- it must always be revalidated so
          # visitors never get stuck on a stale build after a deploy (mobile
          # browsers cache this particularly aggressively). The hashed
          # /static/ assets are still safe to cache long-term since a new
          # build gets new filenames.
          <IfModule mod_headers.c>
            <FilesMatch "^index\.html$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>
          EOF
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=no \
            /tmp/public_html.htaccess "$SSH_USER@$SSH_HOST:public_html/.htaccess"
          rm -f /tmp/public_html.htaccess

      - name: Smoke test
        run: |
          sleep 8
          echo "--- API ---"
          curl -sSf https://api.msafirispace.com/api/v1/listings/hotels/ -H "Accept: application/json" | tee /tmp/hotels.json | head -c 300
          echo
          echo "--- Frontend ---"
          curl -sSf https://msafirispace.com/ | head -c 300
          echo
          echo "--- index.html cache header (catches stale-mobile-cache regressions) ---"
          curl -sSfI https://msafirispace.com/ | grep -i cache-control || echo "MISSING Cache-Control header on index.html!"
          echo
          echo "--- Media (bypasses Passenger -- catches static/media routing regressions) ---"
          IMAGE_PATH=$(python3 -c "
          import json
          data = json.load(open('/tmp/hotels.json'))
          results = data.get('results', [])
          print(results[0]['primary_image'] if results and results[0].get('primary_image') else '')
          ")
          if [ -n "$IMAGE_PATH" ]; then
            curl -sSfI "$IMAGE_PATH" | head -5
          else
            echo "No listings with images yet to check -- skipping media check."
          fi
