name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: msafiri_space
          POSTGRES_USER: msafiri_user
          POSTGRES_PASSWORD: msafiri_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msafiri_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://msafiri_user:msafiri_password@localhost:5432/msafiri_space
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: pytest
      - run: pip install pip-audit && pip-audit -r requirements.txt
        # ponytail: non-blocking until we've triaged the current baseline, make it required once clean
        continue-on-error: true

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
        # ponytail: non-blocking until we've triaged the current baseline, make it required once clean
        continue-on-error: true
      - run: npm test -- --watchAll=false
      - run: npm run build
        env:
          # CI=true (set by GitHub Actions) makes react-scripts treat ESLint
          # warnings as build failures -- this repo has a handful of existing
          # warnings that aren't blocking today, so match local behavior.
          CI: false

  # No staging environment exists yet -- hosting/domain is a Day 6 decision.
  # Add a deploy job here once that's settled.
