server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (CRA's build output) are safe to cache long-term.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: let React Router handle any path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
