# Reverse proxy fronting the backend (gunicorn) and the production frontend
# build, HTTPS via Let's Encrypt. Certs come from certbot running on the VPS
# host (see docs/DEPLOY_NAMECHEAP_VPS.md) -- this container just reads them
# from /etc/nginx/ssl, which docker-compose.yml bind-mounts from the host's
# real /etc/letsencrypt.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend_prod:80;
    }

    # Plain HTTP: only certbot's renewal challenge is served here; everything
    # else redirects to HTTPS so there's never an unencrypted real request.
    server {
        listen 80;
        server_name msafirispace.com www.msafirispace.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name msafirispace.com www.msafirispace.com;
        client_max_body_size 20M;

        ssl_certificate     /etc/nginx/ssl/live/msafirispace.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/msafirispace.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers (Django's SecurityMiddleware already sets
        # X-Frame-Options/X-Content-Type-Options; CSP lives here since nginx
        # is what actually fronts the SPA HTML).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # Served directly by nginx, not proxied through gunicorn.
        location /static/ {
            alias /var/www/static/;
        }

        location /media/ {
            alias /var/www/media/;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
