services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: msafiri_postgres
    environment:
      POSTGRES_DB: msafiri_space
      POSTGRES_USER: msafiri_user
      POSTGRES_PASSWORD: msafiri_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - msafiri_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: msafiri_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - msafiri_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msafiri_backend
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=msafiri.settings
      - DATABASE_URL=postgresql://msafiri_user:msafiri_password@postgres:5432/msafiri_space
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - msafiri_network
    command: python manage.py runserver 0.0.0.0:8000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: msafiri_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - msafiri_network
    command: npm start

  # React Frontend -- production build, served by its own internal nginx
  # (see frontend/Dockerfile's `production` stage). This is what the reverse
  # proxy below actually forwards '/' to; the dev-mode `frontend` service
  # above (CRA dev server) stays separate so `docker-compose up` with no
  # profile is unaffected.
  frontend_prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api/v1
    container_name: msafiri_frontend_prod
    networks:
      - msafiri_network
    profiles:
      - production

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: msafiri_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # Real certs from certbot running on the VPS host (see
      # docs/DEPLOY_NAMECHEAP_VPS.md) -- not the empty ./nginx/ssl placeholder.
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - backend
      - frontend_prod
    networks:
      - msafiri_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  msafiri_network:
    driver: bridge
